[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.11"

name = "PhotoManager"
version = "1.0.0"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "ollama",
    "typer>=0.12",
    "tqdm",
    "ipykernel",
    "ipywidgets",
    "piexif",        # extract timestamp from images
    "pymediainfo",   # extract timestamp from videos
    "blake3>=0.4.1", # fast file hashing
    "rich>=13.7.0",  # better looking CLI output
    "ImageHash",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",          # static typechecks
    "nbqa",          # Tool to run linters on notebooks
    "types-tqdm",
    "pytest",
]
# GUI tools (delview, timeInject) share these; timeInject also needs the
# external `exiftool` binary, which is not a pip package.
gui = ["PySide6", "opencv-python", "Send2Trash"]

[project.scripts]
cais = "cais.cli:main"
delview = "delview.app:main"
mover = "mover.cli:main"
imagetags = "imagetags.main:main"
timeInject = "timeInject.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".git", ".ruff_cache", "__pycache__", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
# Pin the rule set explicitly so lint is stable across ruff releases
# (ruff's default set changes between versions).
select = ["E", "F", "I"]  # pycodestyle errors, pyflakes, import sorting
ignore = ["E501", "E741"] # ignore line-length, ambitious variable names


[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "F841",    # unused variable - common in exploration
    "E402",    # module level import not at top - common in notebooks
    "PLR0913", # too many arguments - common in notebook prototyping
]

############### Type Checking ###############

[tool.mypy]
# Type-check against 3.12 (the CI runtime) so modern dependency stubs parse.
# Runtime support is still >=3.11 (see requires-python); the code uses no
# 3.12-only syntax.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true # Crucial for ML libs (torch, monai) lacking stubs
disable_error_code = [
    "no-any-return",
] # Dangerous! By disabling this we open the door for type leaks. However, maintaining this rule is challenging.
