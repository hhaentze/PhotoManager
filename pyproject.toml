[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
requires-python = "==3.12.*"

name = "PhotoManager"
version = "1.0.0"
dependencies = [
    "ollama",
    "tqdm",
    "ipykernel",
    "ipywidgets",
    "piexif",        # extract timestamp from images
    "pymediainfo",   # extract timestamp from videos
    "blake3>=0.4.1", # fast file hashing
    "rich>=13.7.0",  # better looking CLI output
    "ImageHash",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "ruff[jupyter]",
    "mypy",          # static typechecks
    "nbqa",          # Tool to run linters on notebooks
    "types-tqdm",
    "pytest",
]
[project.scripts]
cais = "cais.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["imagetags*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".git", ".ruff_cache", "__pycache__", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
extend-select = ["I"]     # enable import sorting
ignore = ["E501", "E741"] # ignore line-length, ambitious variable names


[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "F841",    # unused variable - common in exploration
    "E402",    # module level import not at top - common in notebooks
    "PLR0913", # too many arguments - common in notebook prototyping
]

############### Type Checking ###############

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true # Crucial for ML libs (torch, monai) lacking stubs
disable_error_code = [
    "no-any-return",
] # Dangerous! By disabling this we open the door for type leaks. However, maintaining this rule is challenging.
